<!-- ✅ MAIN -->
<main class="pt-32 pb-20">

        <!-- Loading -->

            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-sky-600/20 border border-sky-500 mb-4">

<script>

/* ===== LOAD DATA ===== */
let data = {};
try {
    data = JSON.parse(sessionStorage.getItem("prediction_result") || "{}");
} catch (error) {
    console.error("Failed to parse prediction_result:", error);
    data = {};
}

/* OPTIONAL API */
// fetch("/predict").then(res=>res.json()).then(render);

// Get user's geolocation
let userLocation = null;
if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
        (position) => {
            userLocation = {
                lat: position.coords.latitude,
                lng: position.coords.longitude
            };
            setTimeout(() => render(data), 800);
        },
        (error) => {
            console.log("Geolocation denied, showing without distances");
            setTimeout(() => render(data), 800);
        }
    );
} else {
    setTimeout(() => render(data), 800);
}

// Close modal with Escape key
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        closeHospitalModal();
    }
});

/* ===== HAVERSINE DISTANCE FORMULA ===== */
function calculateDistance(lat1, lng1, lat2, lng2) {
    const R = 6371; // Earth radius in km
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLng / 2) * Math.sin(dLng / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return (R * c).toFixed(1);
}

function getHospitalImage(hospitalName) {
    const nameLower = hospitalName.toLowerCase();
    
    // Check if we have a specific image for this hospital
    if (hospitalImageMap[nameLower]) {
        return hospitalImageMap[nameLower];
    }
    
    // Check for partial matches
    for (const [key, value] of Object.entries(hospitalImageMap)) {
        if (nameLower.includes(key) || key.includes(nameLower)) {
            return value;
        }
    }
    
    // Use fallback image based on hospital name hash
    const imgIndex = Math.abs(hash(hospitalName)) % fallbackImages.length;
    return fallbackImages[imgIndex];
}

function generatePlaceholderSVG(text) {
    const colors = ['#0ea5e9', '#06b6d4', '#10b981', '#f59e0b', '#ef4444'];
    const colorIndex = Math.abs(hash(text)) % colors.length;
    const color = colors[colorIndex];
    
    return `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 400'%3E%3Crect fill='%231e293b' width='600' height='400'/%3E%3Crect fill='${encodeURIComponent(color)}' width='600' height='60' y='170'/%3E%3Ctext x='50%25' y='50%25' text-anchor='middle' dy='.3em' fill='%23f1f5f9' font-size='28' font-family='Arial' font-weight='bold'%3E%3Ctspan x='300' dy='0'%3E%F0%9F%8F%A5%3C/tspan%3E%3C/text%3E%3Ctext x='50%25' y='220' text-anchor='middle' fill='${encodeURIComponent(color)}' font-size='18' font-family='Arial'%3E${encodeURIComponent(text)}%3C/text%3E%3C/svg%3E`;
}

/* ===== HOSPITAL MODAL FUNCTIONS ===== */

    const hospital = data.hospitals[hospitalIndex];
    if (!hospital) return;

    console.log("User location:", userLocation);
    
    // Calculate distance using geolocation
    let distance = 'Calculating...';
    let distanceValue = 0;
    
    if (userLocation && userLocation.lat && userLocation.lng) {
        const hospitalCity = hospital.city.toLowerCase();
        console.log("Hospital city:", hospitalCity);
        
        const coords = cityCoordinates[hospitalCity];
        if (coords) {
            distanceValue = calculateDistance(userLocation.lat, userLocation.lng, coords[0], coords[1]);
            distance = distanceValue;
            console.log("Calculated distance from geo API:", distance, "km");
        } else {
            console.log("City coordinates not found for:", hospitalCity);
            distance = 'Location not calculated';
        }
    } else if (hospital.distance !== undefined && hospital.distance !== null) {
        // Fallback to backend distance
        distance = hospital.distance;
        console.log("Using backend distance:", distance);
    } else {
        console.log("No location data available");
        distance = 'Please enable location access';
    }
    
    // Get hospital image
    const imageUrl = getHospitalImage(hospital.name);
    console.log("Using image:", imageUrl);

            console.log("Error setting fallback:", e);

function closeHospitalModal() {
    document.getElementById('hospitalModal').classList.add('hidden');
}

// Simple hash function for consistent image selection
function hash(str) {
    let hashVal = 0;
    for (let i = 0; i < str.length; i++) {
        hashVal = ((hashVal << 5) - hashVal) + str.charCodeAt(i);
        hashVal = hashVal & hashVal;
    }
    return hashVal;
}

/* ===== RENDER FUNCTION ===== */
function render(data){

    const container = document.getElementById("app");

    if(!data || Object.keys(data).length === 0){
        container.innerHTML = `
            <div class="bg-slate-900/80 border border-slate-700 rounded-xl p-8 text-center">
                <h2 class="text-2xl font-bold mb-4">No prediction data found</h2>
                <p class="text-slate-400 mb-6">Please submit your symptoms first.</p>
                <button onclick="window.location.href='/symptoms'" class="px-6 py-3 bg-sky-600 hover:bg-sky-500 rounded-lg text-white font-bold">Go to Symptoms</button>
            </div>`;
        return;
    }

    if (data.error || data.ml?.error) {
        const message = data.error || data.ml.error;
        container.innerHTML = `
            <div class="bg-rose-900/20 border border-rose-500 rounded-xl p-8 text-center">
                <h2 class="text-2xl font-bold mb-3">Prediction Error</h2>
                <p class="text-slate-300 mb-4">${message}</p>
                <button onclick="window.location.href='/symptoms'" class="px-6 py-3 bg-sky-600 hover:bg-sky-500 rounded-lg text-white font-bold">Try Again</button>
            </div>`;
        return;
    }

    if (!data.ml?.top3?.length) {
        container.innerHTML = `
            <div class="bg-amber-900/20 border border-amber-500 rounded-xl p-8 text-center">
                <h2 class="text-2xl font-bold mb-3">No prediction available</h2>
                <p class="text-slate-300 mb-4">Your information was received, but the model could not produce a prediction.</p>
                <button onclick="window.location.href='/symptoms'" class="px-6 py-3 bg-sky-600 hover:bg-sky-500 rounded-lg text-white font-bold">Review Symptoms</button>
            </div>`;
        return;
    }

    const top = data.ml.top3[0];
    const confidence = Number.isFinite(top.probability) ? Math.round(top.probability * 100) : 0;

    /* ===== STATUS ===== */
    let status = "Low Confidence ❌";
    let statusColor = "text-red-400";

    if(confidence >= 80){
        status = "High Confidence ✅";
        statusColor = "text-emerald-400";
    } else if(confidence >= 50){
        status = "Moderate Confidence ⚠";
        statusColor = "text-yellow-400";
    }

    /* ===== UI ===== */
    container.innerHTML = `

    <!-- STATUS -->
    <div class="bg-gradient-to-r from-emerald-900/40 to-sky-900/40 border border-emerald-500/50 rounded-xl p-6">
        <h2 class="text-2xl font-bold">Prediction Result</h2>
        <p class="${statusColor} font-bold mt-2">Status: ${status}</p>

        <div class="mt-4 space-y-1">
            <p><strong>Disease:</strong> ${top?.disease || data.ml?.prediction || "N/A"}</p>
            <p><strong>Confidence:</strong> ${Number.isFinite(confidence) ? confidence + '%' : '0%'}</p>
        </div>
    </div>

    <!-- TOP PROBABILITIES -->
    <div class="bg-slate-900/50 border border-slate-700 rounded-xl p-6">
        <h3 class="text-xl font-bold mb-4">Top Probabilities</h3>

        ${(data.ml?.top3 || []).map(d => `
            <div class="mb-4">
                <div class="flex justify-between">
                    <span>${d.disease}</span>
                    <span>${(d.probability*100).toFixed(1)}%</span>
                </div>
                <div class="w-full bg-slate-700 h-2 rounded mt-1">
                    <div class="bg-sky-500 h-2 rounded" style="width:${d.probability*100}%"></div>
                </div>
            </div>
        `).join("")}
    </div>

    <!-- POSSIBLE SYMPTOMS -->
    ${data.possible_symptoms?.length ? `
    <div class="bg-slate-900/50 border border-slate-700 rounded-xl p-6">
        <h3 class="text-xl font-bold mb-4">Possible Symptoms</h3>
        <ul class="list-disc pl-6 text-sm space-y-1">
            ${data.possible_symptoms.map(s => `<li>${s}</li>`).join("")}
        </ul>
    </div>
    ` : ""}

    <!-- ACTION -->
    ${data.recommended_action ? `
    <div class="bg-amber-900/20 border border-amber-500/50 rounded-xl p-6">
        <h3 class="text-xl font-bold mb-4 text-amber-300">Recommended Action</h3>
        <p class="text-sm">${data.recommended_action}</p>
    </div>
    ` : ""}

    <!-- HOSPITALS -->
    ${data.hospitals?.length ? `
    <div class="bg-emerald-900/20 border border-emerald-500/50 rounded-xl p-6">
        <h3 class="text-xl font-bold mb-4 text-emerald-300">Nearby Hospitals</h3>
        <div class="space-y-4">
            ${data.hospitals.map((h, idx) => {
                let distanceDisplay = '';
                if (userLocation && h.city) {
                    const coords = cityCoordinates[h.city.toLowerCase()];
                    if (coords) {
                        const distance = calculateDistance(userLocation.lat, userLocation.lng, coords[0], coords[1]);
                        distanceDisplay = distance;
                    }
                } else if (h.distance !== undefined) {
                    distanceDisplay = h.distance;
                }
                
                // Star rating display
                const stars = Math.round(h.rating || 4);
                let starDisplay = '<span class="text-yellow-400">';
                for (let i = 0; i < 5; i++) {
                    starDisplay += i < stars ? '★' : '☆';
                }
                starDisplay += '</span>';
                
                return `
                    <div class="p-4 bg-slate-900/40 rounded-lg border border-slate-700/50 hover:border-emerald-500/30 transition cursor-pointer group" 
                         onclick="openHospitalModal(${idx})" 
                         data-hospital-id="${idx}">
                        <div class="flex gap-4 items-start">
                            <i class="fas fa-hospital-alt text-emerald-400 text-xl mt-1 group-hover:scale-110 transition"></i>
                            <div class="flex-1">
                                <div class="flex justify-between items-start mb-2">
                                    <div>
                                        <p class="font-semibold text-lg group-hover:text-emerald-300 transition">${h.name || 'Hospital'}</p>
                                        <p class="text-xs text-slate-400 capitalize">${h.type || 'Hospital'}</p>
                                    </div>
                                    <div class="text-right">
                                        <div class="text-sm">${starDisplay}</div>
                                        <p class="text-xs text-slate-400 mt-1">${(h.rating || 4).toFixed(1)}/5</p>
                                    </div>
                                </div>
                                
                                ${h.address ? `<p class="text-sm text-slate-400 mb-3">${h.address}</p>` : ""}
                                
                                <div class="flex gap-3 items-center text-sm mb-3">
                                    ${distanceDisplay ? `<span class="text-sky-300"><i class="fas fa-map-marker-alt"></i> ${distanceDisplay} km away</span>` : ""}
                                    ${h.phone ? `<span class="text-emerald-300"><i class="fas fa-phone"></i> ${h.phone}</span>` : ""}
                                </div>
                                
                                <p class="text-xs text-slate-500 group-hover:text-sky-400 transition"><i class="fas fa-image"></i> Click to view hospital details</p>
                            </div>
                        </div>
                    </div>
                `;
            }).join("")}
        </div>
    </div>
    ` : ""}
    
    <!-- HOSPITAL MODAL -->
    <div id="hospitalModal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4" 
         onclick="if(event.target === this) closeHospitalModal()">
        <div class="bg-slate-900 rounded-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto border border-slate-700">
            <div class="sticky top-0 bg-slate-900 border-b border-slate-700 p-4 flex justify-between items-center">
                <h2 id="modalHospitalName" class="text-xl font-bold text-white">Hospital Details</h2>
                <button onclick="closeHospitalModal()" class="text-slate-400 hover:text-white text-2xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="p-6 space-y-4">
                <!-- Hospital Image -->
<div class="w-full h-64 bg-gradient-to-br from-slate-800 to-slate-900 rounded-lg overflow-hidden border border-slate-700 flex items-center justify-center">
                <img id="modalHospitalImage" src="" alt="Hospital" class="w-full h-full object-cover" style="background-color: #1e293b;">
                </div>
                
                <!-- Hospital Info -->
                <div class="space-y-3">
                    <div>
                        <p class="text-xs text-slate-400 uppercase tracking-wide">Hospital Name</p>
                        <p id="modalHospitalFullName" class="text-lg font-semibold text-white"></p>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <p class="text-xs text-slate-400 uppercase tracking-wide">Type</p>
                            <p id="modalHospitalType" class="text-sm font-semibold text-emerald-400"></p>
                        </div>
                        <div>
                            <p class="text-xs text-slate-400 uppercase tracking-wide">Rating</p>
                            <div class="flex items-center gap-2">
                                <span id="modalHospitalStars" class="text-sm text-yellow-400"></span>
                                <span id="modalHospitalRating" class="text-sm font-semibold text-slate-300"></span>
                            </div>
                        </div>
                    </div>
                    
                    <div>
                        <p class="text-xs text-slate-400 uppercase tracking-wide">Address</p>
                        <p id="modalHospitalAddress" class="text-sm text-slate-200"></p>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <p class="text-xs text-slate-400 uppercase tracking-wide">Phone</p>
                            <p id="modalHospitalPhone" class="text-sm font-semibold text-emerald-300"></p>
                        </div>
                        <div>
                            <p class="text-xs text-slate-400 uppercase tracking-wide">Distance</p>
                            <p id="modalHospitalDistance" class="text-sm font-semibold text-sky-300"></p>
                        </div>
                    </div>
                    
                    <div>
                        <p class="text-xs text-slate-400 uppercase tracking-wide">Specialties</p>
                        <div id="modalHospitalSpecialties" class="flex flex-wrap gap-2 mt-2"></div>
                    </div>
                </div>
                
                <div class="bg-blue-900/20 border border-blue-500/30 rounded-lg p-4 mt-4">
                    <p class="text-sm text-blue-200">
                        <i class="fas fa-phone text-blue-400 mr-2"></i>
                        For more information or to make an appointment, call the hospital directly.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- PSYCHOLOGY -->
    ${data.psychology ? `
    <div class="bg-slate-900/50 border border-slate-700 rounded-xl p-6">
        <h3 class="text-xl font-bold mb-4">Psychological Screening</h3>
        <div class="text-sm space-y-2">
            <p><strong>Stress:</strong> ${data.psychology.stress || "N/A"}</p>
            <p><strong>Anxiety:</strong> ${data.psychology.anxiety || "N/A"}</p>
            <p><strong>Sleep:</strong> ${data.psychology.sleep || data.psychology.sleep_quality || "N/A"}</p>
        </div>
    </div>
    ` : ""}

                        ${data.guidance ? `
                    <div class="bg-amber-900/20 border border-amber-500/50 rounded-xl p-6">
                        <h3 class="text-xl font-bold mb-4 text-amber-300">AI Guidance</h3>
                        <div class="text-slate-200 whitespace-pre-wrap text-sm leading-relaxed">
                            ${data.guidance}
                        </div>
                    </div>
                    ` : ''}

    <!-- DISCLAIMER -->
    <div class="bg-rose-900/20 border border-rose-500/30 rounded-lg p-4">
        <p class="text-xs text-rose-100/80">
            <strong>Important:</strong> This is a medical decision support tool only.
        </p>
    </div>

    <!-- BUTTONS -->
    <div class="flex gap-4">
        <button onclick="window.location.href='/'" class="flex-1 px-6 py-3 bg-sky-600 hover:bg-sky-500 rounded-lg font-bold">
            Start New Assessment
        </button>
        <button onclick="window.location.href='/symptoms'" class="flex-1 px-6 py-3 bg-slate-800 hover:bg-slate-700 rounded-lg font-bold">
            Back to Symptoms
        </button>
    </div>

    `;
}

</script>

</body>
</html>
